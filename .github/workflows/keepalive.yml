# Giữ project Supabase gói Free không bị tạm dừng (Free tự pause sau 7 ngày không có truy cập).
# Mỗi 3 ngày gọi 1 truy vấn đọc nhẹ (danh sách khóa công khai) bằng khóa anon. Hết tác dụng/không cần khi đã lên gói Pro.
# Chỉ chạy khi đã cấu hình: Settings › Secrets and variables › Actions
#   - Variables: KEEPALIVE_ENABLED = true
#   - Secrets:   PROD_SUPABASE_URL, PROD_SUPABASE_ANON_KEY
# Lịch (schedule) chỉ chạy trên nhánh mặc định (main).
name: Giữ Supabase hoạt động

on:
  schedule:
    - cron: '0 1 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.KEEPALIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Truy vấn nhẹ vào database
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/courses?select=id&limit=1"
          echo "✔ Supabase phản hồi bình thường"
